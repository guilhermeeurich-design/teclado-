<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ritmo de Digitação - Typing Test</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2.5rem;
      color: #38bdf8;
      margin-bottom: 0.5rem;
    }

    header p {
      color: #94a3b8;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background-color: #1e293b;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .stats-bar {
      display: flex;
      justify-content: space-around;
      margin-bottom: 1.5rem;
      padding: 1rem;
      background-color: #0f172a;
      border-radius: 8px;
    }

    .stat-item {
      text-align: center;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: bold;
      color: #38bdf8;
    }

    .stat-label {
      font-size: 0.85rem;
      color: #94a3b8;
      text-transform: uppercase;
    }

    .text-display {
      font-size: 1.3rem;
      line-height: 1.8;
      background-color: #0f172a;
      padding: 1.5rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      user-select: none;
      word-wrap: break-word;
    }

    .letter {
      position: relative;
    }

    .correct {
      color: #4ade80;
    }

    .incorrect {
      color: #f87171;
      background-color: rgba(248, 113, 113, 0.2);
      border-radius: 2px;
    }

    .current {
      border-bottom: 3px solid #38bdf8;
    }

    .input-field {
      width: 100%;
      padding: 1rem;
      font-size: 1.1rem;
      background-color: #0f172a;
      border: 2px solid #334155;
      border-radius: 8px;
      color: #f8fafc;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      border-color: #38bdf8;
    }

    .controls {
      display: flex;
      justify-content: flex-end;
      margin-top: 1rem;
    }

    .btn {
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: #0284c7;
      color: #f8fafc;
    }
  </style>
</head>
<body>

  <header>
    <h1>Ritmo de Digitação</h1>
    <p>Teste sua velocidade e precisão em tempo real</p>
  </header>

  <main class="container">
    <section class="stats-bar">
      <div class="stat-item">
        <div class="stat-value" id="timer">60</div>
        <div class="stat-label">Tempo (s)</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="wpm">0</div>
        <div class="stat-label">WPM</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="accuracy">100%</div>
        <div class="stat-label">Precisão</div>
      </div>
    </section>

    <div class="text-display" id="textDisplay"></div>

    <input 
      type="text" 
      class="input-field" 
      id="inputField" 
      placeholder="Comece a digitar aqui para iniciar o teste..."
      autocomplete="off"
    >

    <div class="controls">
      <button class="btn" id="restartBtn">Reiniciar Teste</button>
    </div>
  </main>

  <script>
    // Estrutura pronta para receber a lógica JavaScript do teste
  </script>
</body>
</html>
